[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revitls"
version = "0.1.0"
description = "Revision-Aware Incremental Timeline Summarization combining streaming event-state tracking and targeted self-questioning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openai>=1.30",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "tqdm>=4.66",
    "rouge-score>=0.1.2",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.3",
    "transformers>=4.42",
    "accelerate>=0.30",
]
eval = [
    "scipy>=1.11",
    "tilse>=0.1.5",
]
ui = [
    "streamlit>=1.35",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
