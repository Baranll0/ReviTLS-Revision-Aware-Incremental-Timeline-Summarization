  <text x="685" y="60" font-size="11" font-weight="bold" fill="#2c3e50">Leak-Free 1-SFLR (↑)</text>

  <!-- Y-Axis & Grid (Y: 380 is 0.0, 80 is 1.0 => 300px per 1.0 unit) -->
