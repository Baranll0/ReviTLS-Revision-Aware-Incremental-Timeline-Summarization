<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" height="100%" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="460" fill="#ffffff"/>
  <text x="500" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a252f">Quantitative Performance Comparison Across Baselines &amp; 5 ReviTLS Configurations (T17/bpoil)</text>

  <!-- Legend -->
  <rect x="170" y="42" width="660" height="28" rx="4" fill="#f8f9f9" stroke="#bdc3c7"/>
  <rect x="190" y="50" width="14" height="12" fill="#2874a6" stroke="#1b4f72"/>
  <text x="210" y="60" font-size="11" font-weight="bold" fill="#2c3e50">Date-F1 (↑)</text>
  <rect x="320" y="50" width="14" height="12" fill="#1abc9c" stroke="#117864"/>
  <text x="340" y="60" font-size="11" font-weight="bold" fill="#2c3e50">Concat-R1 (↑)</text>
