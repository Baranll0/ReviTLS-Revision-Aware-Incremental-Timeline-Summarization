  <text x="68" y="264" text-anchor="end" font-size="11" fill="#5d6d7e">0.40</text>
  <line x1="75" y1="200" x2="960" y2="200" stroke="#d5dbdb" stroke-dasharray="4,4"/>
  <text x="68" y="204" text-anchor="end" font-size="11" fill="#5d6d7e">0.60</text>
