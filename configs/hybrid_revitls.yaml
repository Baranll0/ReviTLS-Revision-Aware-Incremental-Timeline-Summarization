# ReviTLS dual-scale configuration (the system evaluated in the paper):
# 1. Qwen2.5-7B extractor / routine classifier + Qwen2.5-14B conflict verifier (deferred Phase 2)
# 2. Cross-encoder reranking (cross-encoder/ms-marco-MiniLM-L-6-v2) + lexical overlap
# 3. Conditional dual-horizon gate: same-day for routine claims, 90 days for revision candidates
# 4. Structural revision probe (rho_struct) for cue-free numeric/date corrections
# 5. Date-deduplicated milestone selection with the salience score of Eq. (6)

llm:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "qwen2.5:7b-instruct-q4_K_M"
  temperature: 0.0
  max_tokens: 1024

verifier_llm:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "qwen2.5:14b-instruct-q4_K_M"
  temperature: 0.0
  max_tokens: 1024

embedding:
  model_name: "BAAI/bge-base-en-v1.5"
  device: "cuda"
  normalize: true

retrieval:
  top_k_clusters: 10
  routine_candidate_k: 3
  allow_cross_date: true
  max_date_window_days: 90
  similarity_threshold: 0.45
  strict_temporal_gate: true
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  implicit_probe: true

verifier:
  enable_targeted_verification: true
  max_verification_questions: 3
  max_evidence_docs: 10

timeline:
  default_num_dates: 20
  exclude_retracted: true
  deduplicate_dates: true
