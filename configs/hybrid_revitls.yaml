# ReviTLS-Hybrid Configuration:
# 1. Dual-Scale Qwen2.5 Specialization: Fast 7B Extractor + Deep 14B Conflict Verifier
# 2. Cross-Attention Pairwise Reranker (cross-encoder/ms-marco-MiniLM-L-6-v2) + Lexical Overlap Gate
# 3. Strict Same-Day Temporal Gate + Date-Deduplicated Milestone Selection (maximizes Date-F1 & RRA)

llm:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "qwen2.5:7b-instruct-q4_K_M"
  temperature: 0.0
  max_tokens: 1024

verifier_llm:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model: "qwen2.5:14b-instruct-q4_K_M"
  temperature: 0.0
  max_tokens: 1024

embedding:
  model_name: "BAAI/bge-base-en-v1.5"
  device: "cuda"
  normalize: true

retrieval:
  top_k_clusters: 10
  allow_cross_date: true
  max_date_window_days: 90
  similarity_threshold: 0.45
  strict_temporal_gate: true
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

verifier:
  enable_targeted_verification: true
  max_verification_questions: 3
  max_evidence_docs: 10

timeline:
  default_num_dates: 20
  exclude_retracted: true
  deduplicate_dates: true
